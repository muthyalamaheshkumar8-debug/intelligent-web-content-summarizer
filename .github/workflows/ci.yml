name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: pip install -r scraper/requirements-dev.txt
      - run: npm run lint --prefix server
      - run: npm run lint --prefix client
      - run: npm test --prefix server
      - run: npm run test:db --prefix server
      - run: pytest tests/test_scraper.py -q
      - run: npm run build --prefix client
      - run: npm run test:host --prefix server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm test --prefix client
      - run: npm audit --prefix server --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: pip-audit -r scraper/requirements.txt
      - name: Build free-hosting container
        run: docker build --file Dockerfile.render --tag summarizer-free:ci .
